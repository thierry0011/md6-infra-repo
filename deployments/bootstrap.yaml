template-file-path: templates/bootstrap.yaml
parameters:
  ProjectName: md6-todo
  Environment: dev
  GitHubOrg: "thierry0011"
  GitHubInfraRepo: "md6-infra-repo"
  GitHubDeployBranch: "main"
  # If this AWS account already has a token.actions.githubusercontent.com
