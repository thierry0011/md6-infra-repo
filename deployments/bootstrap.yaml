  # account), set this to "false" - an account can only have one. Set to
  # "true" if this is a fresh account with no provider yet.
  CreateOidcProvider: "false"
tags:
  Project: md6-todo
  Environment: dev
  ManagedBy: CloudFormation-GitSync
