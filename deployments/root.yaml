# Not a Git-sync deployment file - root.yaml is deployed directly by
# .github/workflows/deploy-root-stack.yml, which reads the `parameters` and
# `tags` blocks below to build `aws cloudformation deploy`'s
# --parameter-overrides and --tags. Edit values here to change the deploy;
# a push to this file (or to templates/root.yaml / templates/stacks/**)
# triggers the workflow.
parameters:
  ProjectName: md6-todo
  Environment: dev
  VpcCidr: "10.30.0.0/16"
  PublicSubnet1Cidr: "10.30.0.0/24"
  PublicSubnet2Cidr: "10.30.1.0/24"
  AppSubnet1Cidr: "10.30.10.0/24"
  AppSubnet2Cidr: "10.30.11.0/24"
  DataSubnet1Cidr: "10.30.20.0/24"
  DataSubnet2Cidr: "10.30.21.0/24"
  CacheSubnet1Cidr: "10.30.30.0/24"
  CacheSubnet2Cidr: "10.30.31.0/24"
  EnableNatGateway: "false"
  ContainerPort: "8000"
  DBInstanceClass: db.t3.micro
  DBAllocatedStorage: "20"
  DBEngineVersion: "16.4"
  DBName: todoapp
  DBMultiAZ: "true"
  DBDeletionProtection: "false"
  DBBackupRetentionDays: "7"
  CacheNodeType: cache.t3.micro
  NumCacheClusters: "1"
  EcrRepositoryName: "md6-todo-dev-app"
  EcrRepositoryArn: "arn:aws:ecr:us-east-1:711387109786:repository/md6-todo-dev-app"
  GitHubActionsRoleArn: "arn:aws:iam::711387109786:role/md6-todo-dev-github-actions-ecr-push"
  TaskCpu: "512"
  TaskMemory: "1024"
  ContainerImage: "711387109786.dkr.ecr.us-east-1.amazonaws.com/md6-todo-dev-app:bootstrap"
  DjangoAllowedHosts: "*"
  MinCapacity: "1"
  MaxCapacity: "4"
  CpuTargetValue: "60"
  DeploymentTimeoutMinutes: "15"
tags:
  Project: md6-todo
  Environment: dev
  ManagedBy: GitHubActions-Deploy
