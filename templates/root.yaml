AWSTemplateFormatVersion: "2010-09-09"
Description: To-Do App root stack - 7 nested stacks wired via !GetAtt. Deployed by deploy-root-stack.yml; needs Md6-bootstrap-repo first.

Parameters:
  ProjectName:
    Type: String
    Default: md6-todo

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  # NetworkStack inputs.
  VpcCidr:
    Type: String
    Default: 10.30.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 10.30.0.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.30.1.0/24

  AppSubnet1Cidr:
    Type: String
    Default: 10.30.10.0/24

  AppSubnet2Cidr:
    Type: String
    Default: 10.30.11.0/24

  DataSubnet1Cidr:
    Type: String
    Default: 10.30.20.0/24

  DataSubnet2Cidr:
    Type: String
    Default: 10.30.21.0/24

  CacheSubnet1Cidr:
    Type: String
    Default: 10.30.30.0/24

  CacheSubnet2Cidr:
    Type: String
    Default: 10.30.31.0/24

  EnableNatGateway:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  # Used by SecurityStack and EcsAlbStack.
  ContainerPort:
    Type: Number
    Default: 8000

  # DatabaseStack inputs.
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]

  DBAllocatedStorage:
    Type: Number
    Default: 20

  DBEngineVersion:
    Type: String
    Default: "16.4"

  DBName:
    Type: String
    Default: todoapp

  DBMultiAZ:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  DBDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  DBBackupRetentionDays:
    Type: Number
    Default: 7

  # CacheStack inputs (1 node = no failover).
  CacheNodeType:
    Type: String
    Default: cache.t3.micro

  NumCacheClusters:
    Type: Number
    Default: 1

  # From Md6-bootstrap-repo's outputs.
  EcrRepositoryName:
    Type: String
    Description: Bootstrap output EcrRepositoryName.

  EcrRepositoryArn:
    Type: String
    Description: Bootstrap output EcrRepositoryArn.

  GitHubActionsRoleArn:
    Type: String
    Description: App repo CI role ARN (bootstrap output GitHubActionsRoleArn).

  # EcsAlbStack inputs.
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024"]

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]

  ContainerImage:
    Type: String
    Default: public.ecr.aws/docker/library/httpd:2.4

  DjangoAllowedHosts:
    Type: String
    Default: "*"

  # AutoscalingStack inputs.
  MinCapacity:
    Type: Number
    Default: 1

  MaxCapacity:
    Type: Number
    Default: 4

  CpuTargetValue:
    Type: Number
    Default: 60

  # CicdPipelineStack inputs.
  DeploymentTimeoutMinutes:
    Type: Number
    Default: 15

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/00-network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        AppSubnet1Cidr: !Ref AppSubnet1Cidr
        AppSubnet2Cidr: !Ref AppSubnet2Cidr
        DataSubnet1Cidr: !Ref DataSubnet1Cidr
        DataSubnet2Cidr: !Ref DataSubnet2Cidr
        CacheSubnet1Cidr: !Ref CacheSubnet1Cidr
        CacheSubnet2Cidr: !Ref CacheSubnet2Cidr
        EnableNatGateway: !Ref EnableNatGateway
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-network

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/01-security.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ContainerPort: !Ref ContainerPort
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        VpcCidr: !GetAtt NetworkStack.Outputs.VpcCidr
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-security

  VpcEndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/02-vpc-endpoints.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        AppSubnet1Id: !GetAtt NetworkStack.Outputs.AppSubnet1Id
        AppSubnet2Id: !GetAtt NetworkStack.Outputs.AppSubnet2Id
        DataSubnet1Id: !GetAtt NetworkStack.Outputs.DataSubnet1Id
        DataSubnet2Id: !GetAtt NetworkStack.Outputs.DataSubnet2Id
        VpcEndpointsSecurityGroupId: !GetAtt SecurityStack.Outputs.VpcEndpointsSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-vpc-endpoints

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/03-database.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        DBInstanceClass: !Ref DBInstanceClass
        DBAllocatedStorage: !Ref DBAllocatedStorage
        DBEngineVersion: !Ref DBEngineVersion
        DBName: !Ref DBName
        DBMultiAZ: !Ref DBMultiAZ
        DBDeletionProtection: !Ref DBDeletionProtection
        DBBackupRetentionDays: !Ref DBBackupRetentionDays
        DataSubnet1Id: !GetAtt NetworkStack.Outputs.DataSubnet1Id
        DataSubnet2Id: !GetAtt NetworkStack.Outputs.DataSubnet2Id
        AppKmsKeyId: !GetAtt SecurityStack.Outputs.AppKmsKeyId
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
        DbSecurityGroupId: !GetAtt SecurityStack.Outputs.DbSecurityGroupId
        ProxySecurityGroupId: !GetAtt SecurityStack.Outputs.ProxySecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-database

  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/04-cache.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        CacheNodeType: !Ref CacheNodeType
        NumCacheClusters: !Ref NumCacheClusters
        CacheSubnet1Id: !GetAtt NetworkStack.Outputs.CacheSubnet1Id
        CacheSubnet2Id: !GetAtt NetworkStack.Outputs.CacheSubnet2Id
        CacheSecurityGroupId: !GetAtt SecurityStack.Outputs.CacheSecurityGroupId
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cache

  EcsAlbStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/07-ecs-alb.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ContainerPort: !Ref ContainerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        ContainerImage: !Ref ContainerImage
        DjangoAllowedHosts: !Ref DjangoAllowedHosts
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnet1Id: !GetAtt NetworkStack.Outputs.PublicSubnet1Id
        PublicSubnet2Id: !GetAtt NetworkStack.Outputs.PublicSubnet2Id
        AppSubnet1Id: !GetAtt NetworkStack.Outputs.AppSubnet1Id
        AppSubnet2Id: !GetAtt NetworkStack.Outputs.AppSubnet2Id
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        AppSecurityGroupId: !GetAtt SecurityStack.Outputs.AppSecurityGroupId
        AppKmsKeyId: !GetAtt SecurityStack.Outputs.AppKmsKeyId
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
        DBProxyEndpoint: !GetAtt DatabaseStack.Outputs.DBProxyEndpoint
        DBName: !GetAtt DatabaseStack.Outputs.DBName
        DBCredentialsSecretArn: !GetAtt DatabaseStack.Outputs.DBCredentialsSecretArn
        CacheEndpointAddress: !GetAtt CacheStack.Outputs.CacheEndpointAddress
        CacheEndpointPort: !GetAtt CacheStack.Outputs.CacheEndpointPort
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-ecs-alb

  AutoscalingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/08-autoscaling.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
        CpuTargetValue: !Ref CpuTargetValue
        EcsClusterName: !GetAtt EcsAlbStack.Outputs.EcsClusterName
        EcsServiceName: !GetAtt EcsAlbStack.Outputs.EcsServiceName
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-autoscaling

  CicdPipelineStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/09-cicd-pipeline.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        GitHubActionsRoleArn: !Ref GitHubActionsRoleArn
        DeploymentTimeoutMinutes: !Ref DeploymentTimeoutMinutes
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
        EcrRepositoryName: !Ref EcrRepositoryName
        EcrRepositoryArn: !Ref EcrRepositoryArn
        AlbFullName: !GetAtt EcsAlbStack.Outputs.AlbFullName
        BlueTargetGroupFullName: !GetAtt EcsAlbStack.Outputs.BlueTargetGroupFullName
        GreenTargetGroupFullName: !GetAtt EcsAlbStack.Outputs.GreenTargetGroupFullName
        BlueTargetGroupName: !GetAtt EcsAlbStack.Outputs.BlueTargetGroupName
        GreenTargetGroupName: !GetAtt EcsAlbStack.Outputs.GreenTargetGroupName
        ProdListenerArn: !GetAtt EcsAlbStack.Outputs.ProdListenerArn
        EcsClusterName: !GetAtt EcsAlbStack.Outputs.EcsClusterName
        EcsServiceName: !GetAtt EcsAlbStack.Outputs.EcsServiceName
        TaskDefinitionFamily: !GetAtt EcsAlbStack.Outputs.TaskDefinitionFamily
        TaskExecutionRoleArn: !GetAtt EcsAlbStack.Outputs.TaskExecutionRoleArn
        TaskRoleArn: !GetAtt EcsAlbStack.Outputs.TaskRoleArn
        AppSubnet1Id: !GetAtt NetworkStack.Outputs.AppSubnet1Id
        AppSubnet2Id: !GetAtt NetworkStack.Outputs.AppSubnet2Id
        AppSecurityGroupId: !GetAtt SecurityStack.Outputs.AppSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cicd-pipeline

Outputs:
  AlbDnsName:
    Value: !GetAtt EcsAlbStack.Outputs.AlbDnsName

  PipelineArtifactBucketName:
    Value: !GetAtt CicdPipelineStack.Outputs.PipelineArtifactBucketName
    Description: App repo variable ARTIFACT_BUCKET.

  DBProxyEndpoint:
    Value: !GetAtt DatabaseStack.Outputs.DBProxyEndpoint

  DBName:
    Value: !GetAtt DatabaseStack.Outputs.DBName

  DBCredentialsSecretArn:
    Value: !GetAtt DatabaseStack.Outputs.DBCredentialsSecretArn

  CacheEndpointAddress:
    Value: !GetAtt CacheStack.Outputs.CacheEndpointAddress

  CacheEndpointPort:
    Value: !GetAtt CacheStack.Outputs.CacheEndpointPort

  TaskExecutionRoleArn:
    Value: !GetAtt EcsAlbStack.Outputs.TaskExecutionRoleArn

  TaskRoleArn:
    Value: !GetAtt EcsAlbStack.Outputs.TaskRoleArn

  DjangoSecretKeySecretArn:
    Value: !GetAtt EcsAlbStack.Outputs.DjangoSecretKeySecretArn
