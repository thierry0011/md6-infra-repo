AWSTemplateFormatVersion: "2010-09-09"
Description: >
  To-Do App - Public ALB with two target groups (blue/green for CodeDeploy)
  behind one prod listener, an S3 bucket for ALB access logs, ECS Fargate
  cluster, task definition and service. The service's DeploymentController
  is CODE_DEPLOY: CodeDeploy owns traffic shifting between the two target
  groups, CloudFormation only owns the initial state. No test listener -
  CodeDeploy validates the new task set via the target group's own health
  check, not a side-channel URL (the pipeline never pauses for manual
  validation anyway - see 09-cicd-pipeline.yaml's ActionOnTimeout).

Parameters:
  ProjectName:
    Type: String
    Default: md6-todo

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ContainerPort:
    Type: Number
    Default: 8000

  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024"]

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]

  ContainerImage:
    Type: String
    Default: public.ecr.aws/docker/library/httpd:2.4
    Description: >
      Bootstrap placeholder image so the ECS service can start before the
      first real application image exists. The CodeDeploy pipeline replaces
      this with the ECR app image on the first successful deployment.

  DjangoAllowedHosts:
    Type: String
    Default: "*"
    Description: Comma-separated ALLOWED_HOSTS for Django; tighten to the ALB DNS name after first deploy.

  VpcId:
    Type: String
    Description: VPC id from the network stack.

  PublicSubnet1Id:
    Type: String
    Description: Public subnet 1 id from the network stack.

  PublicSubnet2Id:
    Type: String
    Description: Public subnet 2 id from the network stack.

  AppSubnet1Id:
    Type: String
    Description: App subnet 1 id from the network stack.

  AppSubnet2Id:
    Type: String
    Description: App subnet 2 id from the network stack.

  AlbSecurityGroupId:
    Type: String
    Description: ALB security group id from the security stack.

  AppSecurityGroupId:
    Type: String
    Description: ECS task security group id from the security stack.

  AppKmsKeyId:
    Type: String
    Description: Shared CMK key id from the security stack.

  AppKmsKeyArn:
    Type: String
    Description: Shared CMK ARN from the security stack.

  DBProxyEndpoint:
    Type: String
    Description: RDS Proxy endpoint from the database stack - the app only ever talks to this.

  DBName:
    Type: String
    Description: Database name from the database stack.

  DBCredentialsSecretArn:
    Type: String
    Description: DB credentials secret ARN from the database stack.

  CacheEndpointAddress:
    Type: String
    Description: ElastiCache Redis primary endpoint address from the cache stack.

  CacheEndpointPort:
    Type: String
    Description: ElastiCache Redis primary endpoint port from the cache stack.

Conditions:
  # True only for the default bootstrap value - a real ContainerImage passes through unchanged.
  IsPlaceholderImage: !Equals [!Ref ContainerImage, "public.ecr.aws/docker/library/httpd:2.4"]

Resources:
  # S3 bucket the ALB delivers its own access logs to (SSE-S3 only, ALB's requirement).
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-${Environment}-alb-logs-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # ALB access logs only support SSE-S3, not SSE-KMS.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-alb-logs

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Region-agnostic: AWS's log-delivery service principal, no per-region ELB account ID mapping needed.
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AccessLogsBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*
          - Sid: AWSLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AccessLogsBucket.Arn

  # Public ALB with two target groups (blue/green) behind one prod listener.
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AccessLogsBucketPolicy
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref AccessLogsBucket
        - Key: access_logs.s3.prefix
          Value: alb
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-alb

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-tg-blue
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-tg-blue

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-tg-green
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-tg-green

  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  DjangoSecretKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-django-secret-key
      Description: Django SECRET_KEY, generated once and injected into the task at runtime.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: SECRET_KEY
        PasswordLength: 50
        ExcludePunctuation: true
      KmsKeyId: !Ref AppKmsKeyId

  # ECS Fargate cluster, task definition, and service (CodeDeploy-controlled).
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-${Environment}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cluster

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}-${Environment}
      RetentionInDays: 30
      KmsKeyId: !Ref AppKmsKeyArn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDbSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DBCredentialsSecretArn
                  - !Ref DjangoSecretKey
        - PolicyName: DecryptWithAppKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref AppKmsKeyArn
        - PolicyName: PullThroughPlaceholderImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:BatchImportUpstreamImage
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/ecr-public/*

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Description: >
        Runtime role for the Django container itself. No AWS SDK calls are
        needed for this app today (no S3/file storage) - kept as a bare,
        assumable role so a future feature (e.g. CloudWatch custom
        metrics) only needs an inline policy added here, not a new role
        threaded through the task definition and pipeline.

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${Environment}-app
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          # Placeholder pulls through our own ECR (see 05-ecr.yaml) - a real ContainerImage passes through unchanged.
          Image: !If
            - IsPlaceholderImage
            - !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ecr-public/docker/library/httpd:2.4
            - !Ref ContainerImage
          Essential: true
          # Placeholder-only: httpd needs :8000 and a 200 at /health/ - CodeDeploy swaps in the real app's task definition later.
          Command:
            - "httpd-foreground"
            - "-C"
            - !Sub "Listen ${ContainerPort}"
            - "-C"
            - "Alias /health/ /usr/local/apache2/htdocs/index.html"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: DJANGO_ALLOWED_HOSTS
              Value: !Ref DjangoAllowedHosts
            - Name: POSTGRES_HOST
              Value: !Ref DBProxyEndpoint
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_DB
              Value: !Ref DBName
            - Name: REDIS_HOST
              Value: !Ref CacheEndpointAddress
            - Name: REDIS_PORT
              Value: !Ref CacheEndpointPort
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: POSTGRES_USER
              ValueFrom: !Sub "${DBCredentialsSecretArn}:username::"
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DBCredentialsSecretArn}:password::"
            - Name: DJANGO_SECRET_KEY
              ValueFrom: !Sub "${DjangoSecretKey}:SECRET_KEY::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  AppService:
    Type: AWS::ECS::Service
    DependsOn: [ProdListener]
    Properties:
      ServiceName: !Sub ${ProjectName}-${Environment}-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref AppTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref AppSubnet1Id
            - !Ref AppSubnet2Id
          SecurityGroups:
            - !Ref AppSecurityGroupId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-service

Outputs:
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  AlbArn:
    Value: !Ref ApplicationLoadBalancer

  AlbFullName:
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName

  BlueTargetGroupFullName:
    Value: !GetAtt BlueTargetGroup.TargetGroupFullName

  GreenTargetGroupFullName:
    Value: !GetAtt GreenTargetGroup.TargetGroupFullName

  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup

  GreenTargetGroupArn:
    Value: !Ref GreenTargetGroup

  ProdListenerArn:
    Value: !Ref ProdListener

  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName

  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName

  EcsClusterName:
    Value: !Ref EcsCluster

  EcsClusterArn:
    Value: !GetAtt EcsCluster.Arn

  EcsServiceName:
    Value: !GetAtt AppService.Name

  TaskDefinitionFamily:
    Value: !Sub ${ProjectName}-${Environment}-app

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn

  DjangoSecretKeySecretArn:
    Value: !Ref DjangoSecretKey

  AppLogGroupName:
    Value: !Ref AppLogGroup
