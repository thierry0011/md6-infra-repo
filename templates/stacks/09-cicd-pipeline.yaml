# ECR is IMMUTABLE (unique tag per build, no "latest"), so EventBridge has no image-tag filter and instead pins the pipeline to the exact pushed digest via an InputTransformer on StartPipelineExecution (a documented AWS pattern, not a workaround).
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  To-Do App - Blue/green deployment pipeline. The pipeline has two Source
  actions: an ECR source action that resolves the pushed image's digest
  natively, and an S3 source action reading a static taskdef.json/
  appspec.yaml template (containing a literal "<IMAGE1_NAME>" placeholder
  in the image field) that the app repo's CI uploads via its own GitHub
  OIDC role - CodePipeline never talks to GitHub directly, so there's no
  CodeConnections handshake to complete for this repo. The app repo's
  workflow uploads the template *before* pushing the image, so it's always
  already in place by the time the ECR-push trigger fires. An EventBridge
  rule detects every successful image push to ECR (no tag filter - see
  comment above) and starts CodePipeline, which runs a one-off database
  migration via CodeBuild, then hands off to CodeDeploy for an ECS
  blue/green traffic shift between the two ALB target groups.

Parameters:
  ProjectName:
    Type: String
    Default: md6-todo

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  GitHubActionsRoleArn:
    Type: String
    Description: >
      GitHub Actions role ARN from Md6-bootstrap-repo's stack. Granted
      write access to this stack's S3 artifact bucket (source prefix only)
      and encrypt/decrypt on AppKmsKeyArn, so the app repo's CI can upload
      the taskdef.json/appspec.yaml template without CodePipeline ever
      reading from GitHub directly.

  DeploymentTimeoutMinutes:
    Type: Number
    Default: 15
    Description: Minutes CodeDeploy waits for the old (blue) task set to be terminated after traffic shifts.

  AppKmsKeyArn:
    Type: String
    Description: Shared CMK ARN from the security stack.

  EcrRepositoryName:
    Type: String
    Description: ECR repository name from the ecr stack.

  EcrRepositoryArn:
    Type: String
    Description: ECR repository ARN from the ecr stack.

  AlbFullName:
    Type: String
    Description: ALB full name from the ecs-alb stack.

  BlueTargetGroupFullName:
    Type: String
    Description: Blue target group full name from the ecs-alb stack.

  GreenTargetGroupFullName:
    Type: String
    Description: Green target group full name from the ecs-alb stack.

  BlueTargetGroupName:
    Type: String
    Description: Blue target group name from the ecs-alb stack.

  GreenTargetGroupName:
    Type: String
    Description: Green target group name from the ecs-alb stack.

  ProdListenerArn:
    Type: String
    Description: Production listener ARN from the ecs-alb stack.

  EcsClusterName:
    Type: String
    Description: ECS cluster name from the ecs-alb stack.

  EcsServiceName:
    Type: String
    Description: ECS service name from the ecs-alb stack.

  TaskDefinitionFamily:
    Type: String
    Description: ECS task definition family from the ecs-alb stack (used by the migration step).

  TaskExecutionRoleArn:
    Type: String
    Description: ECS task execution role ARN from the ecs-alb stack.

  TaskRoleArn:
    Type: String
    Description: ECS task role ARN from the ecs-alb stack.

  AppSubnet1Id:
    Type: String
    Description: App subnet 1 id from the network stack (migration task network placement).

  AppSubnet2Id:
    Type: String
    Description: App subnet 2 id from the network stack.

  AppSecurityGroupId:
    Type: String
    Description: App security group id from the security stack (migration task network placement).

Resources:
  # S3 bucket CodePipeline stores stage artifacts in, KMS-encrypted. Also the
  # target the app repo's CI uploads the taskdef.json/appspec.yaml template to.
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref AppKmsKeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  # Grants the app repo's CI role write access to just the deploy-artifact prefix.
  PipelineArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PipelineArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAppRepoCiUploadDeployArtifact
            Effect: Allow
            Principal:
              AWS: !Ref GitHubActionsRoleArn
            Action: s3:PutObject
            Resource: !Sub ${PipelineArtifactBucket.Arn}/source/*

  GitHubActionsArtifactUploadKmsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-${Environment}-github-actions-artifact-kms
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EncryptDeployArtifact
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: !Ref AppKmsKeyArn
      Roles:
        - !Select [1, !Split ["/", !Ref GitHubActionsRoleArn]]

  # One-off Fargate task that runs `manage.py migrate` before CodeDeploy ever shifts traffic.
  MigrationProjectRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-migration-codebuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunMigrationTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunAndDescribeTask
                Effect: Allow
                Action:
                  - ecs:RunTask
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  # RunTask's container overrides can't swap the image (only name/command/env/cpu/memory) -
                  # the migration task needs its own task definition revision pointing at this build's image.
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Sid: PassEcsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref TaskExecutionRoleArn
                  - !Ref TaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: CodeBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-${Environment}-migrate*
              - Sid: ArtifactBucketRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${PipelineArtifactBucket.Arn}/*
              - Sid: KmsForArtifacts
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref AppKmsKeyArn

  MigrationProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-migrate
      Description: Runs `python manage.py migrate` as a one-off Fargate task before CodeDeploy shifts traffic.
      ServiceRole: !GetAtt MigrationProjectRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              commands:
                - yum install -y jq >/dev/null
            build:
              commands:
                - IMAGE_URI=$(jq -r '.ImageURI' imageDetail.json)
                - echo "Running migrations against image $IMAGE_URI"
                # RunTask's containerOverrides can only override name/command/env/cpu/memory, not image -
                # register a one-off task def revision (same role/resources, image swapped) to run against.
                - >
                  aws ecs describe-task-definition --task-definition ${TaskDefinitionFamily}
                  --query taskDefinition > current-taskdef.json
                - >
                  jq --arg IMAGE_URI "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE_URI
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)'
                  current-taskdef.json > migration-taskdef.json
                - >
                  NEW_TASK_DEF_ARN=$(aws ecs register-task-definition
                  --cli-input-json file://migration-taskdef.json
                  --query 'taskDefinition.taskDefinitionArn' --output text)
                - 'echo "Registered migration task definition: $NEW_TASK_DEF_ARN"'
                - >
                  TASK_ARN=$(aws ecs run-task
                  --cluster ${EcsClusterName}
                  --task-definition "$NEW_TASK_DEF_ARN"
                  --launch-type FARGATE
                  --network-configuration "awsvpcConfiguration={subnets=[${AppSubnet1Id},${AppSubnet2Id}],securityGroups=[${AppSecurityGroupId}],assignPublicIp=DISABLED}"
                  --overrides "{\"containerOverrides\":[{\"name\":\"app\",\"command\":[\"python\",\"manage.py\",\"migrate\",\"--noinput\"]}]}"
                  --query 'tasks[0].taskArn' --output text)
                - 'echo "Migration task: $TASK_ARN"'
                - aws ecs wait tasks-stopped --cluster ${EcsClusterName} --tasks "$TASK_ARN"
                - >
                  EXIT_CODE=$(aws ecs describe-tasks --cluster ${EcsClusterName} --tasks "$TASK_ARN"
                  --query 'tasks[0].containers[0].exitCode' --output text)
                - 'echo "Migration task exit code: $EXIT_CODE"'
                - test "$EXIT_CODE" = "0"
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      TimeoutInMinutes: 15
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-migrate

  # CodeDeploy application + deployment group that performs the ECS blue/green traffic shift.
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-codedeploy-ecs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  BlueTargetGroupUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-blue-tg-unhealthy
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: TargetGroup
          Value: !Ref BlueTargetGroupFullName
        - Name: LoadBalancer
          Value: !Ref AlbFullName

  GreenTargetGroupUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-green-tg-unhealthy
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: TargetGroup
          Value: !Ref GreenTargetGroupFullName
        - Name: LoadBalancer
          Value: !Ref AlbFullName

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ProjectName}-${Environment}-app
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${ProjectName}-${Environment}-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref BlueTargetGroupUnhealthyAlarm
          - Name: !Ref GreenTargetGroupUnhealthyAlarm
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref DeploymentTimeoutMinutes
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      ECSServices:
        - ClusterName: !Ref EcsClusterName
          ServiceName: !Ref EcsServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref ProdListenerArn
            TargetGroups:
              - Name: !Ref BlueTargetGroupName
              - Name: !Ref GreenTargetGroupName

  # CodePipeline: Source (GitHub + ECR) -> Migrate (CodeBuild) -> Deploy (CodeDeployToECS).
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-codepipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub ${PipelineArtifactBucket.Arn}/*
              - Sid: KmsForArtifacts
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref AppKmsKeyArn
              - Sid: EcrSourceAction
                Effect: Allow
                Action:
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Ref EcrRepositoryArn
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: RunMigrationBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt MigrationProject.Arn
              - Sid: CodeDeployDrive
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Sid: EcsAndPassRole
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: PassEcsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref TaskExecutionRoleArn
                  - !Ref TaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  AppPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !Ref AppKmsKeyArn
      Stages:
        - Name: Source
          Actions:
            # Static template (taskdef.json has a literal "<IMAGE1_NAME>" placeholder) - uploaded before every image push, see the app repo's build-and-push.yml.
            - Name: TaskDefTemplateSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !Ref PipelineArtifactBucket
                S3ObjectKey: source/appspec-taskdef.zip
                PollForSourceChanges: "false"
              OutputArtifacts:
                - Name: TemplateArtifactOutput
              RunOrder: 1
            - Name: ImageSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                # Static placeholder only - EcrPushRule's sourceRevisions override always pins the real digest at execution time.
                ImageTag: latest
                RepositoryName: !Ref EcrRepositoryName
              OutputArtifacts:
                - Name: ImageSourceOutput
              RunOrder: 1
        - Name: Migrate
          Actions:
            - Name: RunDatabaseMigration
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              InputArtifacts:
                - Name: ImageSourceOutput
              Configuration:
                ProjectName: !Ref MigrationProject
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployToECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              InputArtifacts:
                - Name: TemplateArtifactOutput
                - Name: ImageSourceOutput
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: TemplateArtifactOutput
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: TemplateArtifactOutput
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageSourceOutput
                Image1ContainerName: IMAGE1_NAME
              RunOrder: 1

  # EventBridge rule: any successful ECR push starts the pipeline, pinned to that exact image digest.
  EventBridgeInvokePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-eventbridge-pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${AppPipeline}

  EcrPushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-ecr-push-trigger
      Description: >
        Starts the deployment pipeline on every successful image push to
        ECR, regardless of tag, pinning the run to the exact digest pushed.
      EventPattern:
        source: [aws.ecr]
        detail-type: ["ECR Image Action"]
        detail:
          action-type: [PUSH]
          result: [SUCCESS]
          repository-name:
            - !Ref EcrRepositoryName
      State: ENABLED
      Targets:
        - Id: StartCodePipeline
          Arn: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${AppPipeline}
          RoleArn: !GetAtt EventBridgeInvokePipelineRole.Arn
          InputTransformer:
            InputPathsMap:
              revisionValue: "$.detail.image-digest"
            InputTemplate: |
              {"sourceRevisions": [{"actionName": "ImageSource", "revisionType": "IMAGE_DIGEST", "revisionValue": "<revisionValue>"}]}

Outputs:
  PipelineArtifactBucketName:
    Value: !Ref PipelineArtifactBucket
    Description: Put this in the app repo's build-and-push.yml as ARTIFACT_BUCKET.

  PipelineName:
    Value: !Ref AppPipeline

  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication

  CodeDeployDeploymentGroupName:
    Value: !Ref CodeDeployDeploymentGroup

  MigrationProjectName:
    Value: !Ref MigrationProject
